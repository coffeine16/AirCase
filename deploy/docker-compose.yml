# n8n + Caddy. Copy this file and Caddyfile to the VM (deploy/README.md step 4).
services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/   # Telegram registers webhooks against this
      - GENERIC_TIMEZONE=Asia/Kolkata
      # Supabase reaches the workflow as ENV, not as a value pasted into a node.
      # The anon key is public by design (it is what a browser would carry, with
      # row-level security doing the actual protecting) but a key living in
      # workflow JSON still ends up in exports, screenshots and version history,
      # and there is no reason to put it there.
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # n8n blocks $env inside expressions unless this is set, so the two lines
      # above would otherwise resolve to empty at runtime with no error.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n            # workflows + credentials survive restarts
    expose:
      - "5678"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"                              # ACME challenge
      - "443:443"
    environment:
      - N8N_DOMAIN=${N8N_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                     # certs survive restarts — do not lose these

volumes:
  n8n_data:
  caddy_data:
