# n8n + Caddy. Copy this file and Caddyfile to the VM (deploy/README.md step 4).
services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/   # Telegram registers webhooks against this
      - GENERIC_TIMEZONE=Asia/Kolkata
      # Supabase reaches the workflow as ENV, not as a value pasted into a node.
      # The anon key is public by design (it is what a browser would carry, with
      # row-level security doing the actual protecting) but a key living in
      # workflow JSON still ends up in exports, screenshots and version history,
      # and there is no reason to put it there.
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # Telegram's bot token, same reasoning as the Supabase keys above — except
      # this one is NOT public: it is full control of the bot. It reaches the
      # HTTP Request nodes as $env so it never lands in workflow JSON, which is
      # what gets exported and screenshotted. Using a plain Webhook node plus
      # this token, rather than n8n's Telegram Trigger, is deliberate: the
      # trigger node needs a stored CREDENTIAL, and credentials live only in the
      # n8n volume — so a rebuilt box loses them silently, which is exactly how
      # the GCP instance took this workflow down with it.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # The Telegram intake's classifier node calls Gemini as
      # $env.GEMINI_API_KEY. Without this line that expression resolves to an
      # EMPTY STRING and the request 400s on every message — indistinguishable,
      # from the outside, from the quota being exhausted, because both land in
      # the same keyword fallback. The workflow keeps working either way, which
      # is exactly why this was invisible: nothing breaks, the LLM half just
      # never runs.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # n8n blocks $env inside expressions unless this is set, so every var
      # above would otherwise resolve to empty at runtime WITH NO ERROR — the
      # Supabase insert would post to "/rest/v1/citizen_reports" against no
      # host, and sendMessage would call .../bot/sendMessage. Silent, not loud.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n            # workflows + credentials survive restarts
    expose:
      - "5678"

  # AirCase serving API — read-only contracts + POST /run/agent.
  # Safe to co-locate with n8n on a 2 GB box: the agent chain reads PRECOMPUTED
  # artifacts and re-scores them (~15 s). Ingestion, the panel build and fusion
  # training are unreachable from here by construction, so nothing in this
  # container ever pulls a satellite tile or fits a model.
  api:
    build:
      context: ./api          # code + data shipped separately; see deploy/README.md
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - AQ_CITY=delhi         # instance default; every endpoint takes ?city=
      - PORT=8080
      # Attribution and advisory call the LLM gateway, which falls back to a
      # deterministic rule-based reasoner when no key is present or the provider
      # rate-limits. Passing the key through is an optimisation, not a
      # dependency — the chain returns the same schema either way.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    # LightGBM + pandas on a 2 GB box shared with n8n. Capped so a runaway agent
    # run degrades ITSELF rather than OOM-killing n8n, which would take the
    # citizen intake and Telegram webhook down with it.
    #
    # 900m was NOT enough and failed loudly: POST /run/agent on Delhi hit the
    # cgroup limit at 916 MB RSS and the kernel OOM-killed uvicorn mid-request,
    # which Caddy surfaced as a bare 502. Delhi's panel is 3.68 M rows and pandas
    # holds it far wider in memory than the 25 MB parquet suggests.
    #
    # memswap_limit ABOVE mem_limit is the load-bearing half: with them equal
    # (compose's default when only mem_limit is set) the container gets no swap
    # at all, so the host's 2 GB swapfile would sit unused while the cgroup died.
    # This way the peak spills to disk and the run survives; n8n keeps the
    # headroom it needs because the cap is still a cap.
    mem_limit: 1400m
    memswap_limit: 2600m
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"                              # ACME challenge
      - "443:443"
    environment:
      - N8N_DOMAIN=${N8N_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                     # certs survive restarts — do not lose these

volumes:
  n8n_data:
  caddy_data:
